<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>웹 구독 | CH2 DATA</title>
    <meta name="description" content="CH2 웹 구독 — 카드 자동결제 (토스페이먼츠)" />
    <link rel="stylesheet" href="/style.css" />
    <style>
      .plan-grid { display: grid; gap: 1rem; margin-top: 1rem; }
      @media (min-width: 640px) { .plan-grid { grid-template-columns: repeat(2, 1fr); } }
      .plan-card {
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 1rem 1.25rem;
        background: #fff;
      }
      .plan-card h3 { margin: 0 0 0.5rem; }
      .plan-card p { margin: 0 0 1rem; color: #475569; }
      .pay-actions { display: grid; gap: 0.5rem; }
      .btn-pay {
        width: 100%;
        padding: 0.65rem 1rem;
        border: 0;
        border-radius: 8px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-pay:disabled {
        background: #94a3b8;
        color: #fff;
        cursor: not-allowed;
      }
      .btn-pay--kakao {
        background: #fee500;
        color: #191919;
      }
      .btn-pay--card {
        background: #2563eb;
        color: #fff;
      }
      .btn-pay--outline {
        background: #fff;
        color: #334155;
        border: 1px solid #cbd5e1;
      }
      .auth-row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin: 1rem 0; }
      .auth-row button {
        padding: 0.5rem 1rem;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        background: #fff;
        cursor: pointer;
      }
      .review-login {
        margin: 1rem 0 0;
        padding-top: 1rem;
        border-top: 1px solid #e2e8f0;
      }
      .review-login h2 {
        margin: 0 0 0.75rem;
        font-size: 0.9375rem;
        color: #334155;
      }
      .review-login__grid {
        display: grid;
        gap: 0.5rem;
        max-width: 24rem;
      }
      .review-login__grid input {
        width: 100%;
        padding: 0.55rem 0.75rem;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font: inherit;
      }
      .review-login__grid button {
        padding: 0.55rem 0.75rem;
        border: 0;
        border-radius: 8px;
        background: #334155;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      #status { color: #334155; font-size: 0.9375rem; }
      #pay-note { margin-top: 1rem; color: #64748b; font-size: 0.9375rem; }
    </style>
    <script src="https://js.tosspayments.com/v2/standard"></script>
  </head>
  <body>
    <div class="page">
      <header class="hero hero--document">
        <p class="hero__eyebrow">CH2 Pro</p>
        <h1 class="hero__title">웹 구독</h1>
        <p class="hero__lead">로그인 후 카드로 월 구독을 시작합니다. 매월 자동 결제되며, 해지하면 이번 기간 말까지 이용할 수 있습니다.</p>
      </header>

      <main class="policy-card">
        <div class="auth-row">
          <button type="button" id="login-btn">Google로 계속하기</button>
          <button type="button" id="kakao-login-btn" hidden>Kakao로 계속하기</button>
          <button type="button" id="logout-btn" hidden>로그아웃</button>
          <span id="status">로그인이 필요합니다.</span>
        </div>
        <section class="review-login" id="review-login" hidden>
          <h2>심사용 로그인</h2>
          <form class="review-login__grid" id="review-login-form">
            <input type="email" id="review-email" autocomplete="username" placeholder="이메일" required />
            <input type="password" id="review-password" autocomplete="current-password" placeholder="비밀번호" required />
            <button type="submit">이메일로 로그인</button>
          </form>
        </section>
        <section id="sub-status" class="review-login" hidden aria-live="polite">
          <h2>현재 구독</h2>
          <p id="sub-status-text"></p>
          <button type="button" id="cancel-sub-btn" hidden>다음 결제일부터 해지</button>
          <button type="button" id="resume-sub-btn" hidden>해지 예약 취소</button>
        </section>
        <div class="plan-grid" id="plan-grid"></div>
        <p id="pay-note"></p>
        <p class="policy-meta" style="margin-top: 1.5rem">
          웹 월 구독은 카드 자동결제(토스페이먼츠)입니다. 첫 결제 시 카드 등록창이 열립니다.
          자세한 내용은 <a href="/subscription/">구독 정책</a>을 참고하세요.
        </p>
      </main>

      <footer class="footer">
        <nav class="footer__links">
          <a href="https://macro.ch2data.com/">Macro 서비스</a>
          <a href="/refund/">환불 정책</a>
        </nav>
        <p>© CH2 DATA</p>
      </footer>
    </div>
    <script>
      const AUTH = "/api/auth";
      const BILLING = "/api/billing";
      let me = null;
      let tossEnabled = false;
      let subInfo = null;

      function formatDate(iso) {
        if (!iso) return "";
        const d = new Date(iso);
        return Number.isNaN(d.getTime()) ? iso : d.toLocaleDateString("ko-KR");
      }

      async function refreshAuth() {
        const res = await fetch(`${AUTH}/status`, { credentials: "include" });
        const data = await res.json();
        me = data.logged_in ? data : null;
        const kakaoOn = Boolean(data.providers && data.providers.kakao);
        const reviewOn = Boolean(data.providers && data.providers.review);
        document.getElementById("login-btn").hidden = Boolean(me);
        document.getElementById("kakao-login-btn").hidden = Boolean(me) || !kakaoOn;
        document.getElementById("logout-btn").hidden = !me;
        document.getElementById("review-login").hidden = Boolean(me) || !reviewOn;
        document.getElementById("status").textContent = me
          ? `${me.nickname}님`
          : "로그인이 필요합니다.";
      }

      async function loadSubscription() {
        subInfo = null;
        const box = document.getElementById("sub-status");
        if (!me) {
          box.hidden = true;
          return;
        }
        const res = await fetch(`${BILLING}/subscription/me`, { credentials: "include" });
        const data = await res.json();
        if (!data.active) {
          box.hidden = true;
          return;
        }
        subInfo = data;
        box.hidden = false;
        const productLabel = data.product === "bundle" ? "Macro + FieldNote" : "Macro";
        const end = formatDate(data.current_period_end);
        const next = formatDate(data.next_billing_at);
        let line = `${productLabel} 월 ${(data.price || 0).toLocaleString()}원 · 이용 기간 ~${end}`;
        if (data.cancel_at_period_end) {
          line += " · 해지 예약됨 (다음 결제 없음)";
        } else if (next) {
          line += ` · 다음 결제 ${next}`;
        }
        document.getElementById("sub-status-text").textContent = line;
        document.getElementById("cancel-sub-btn").hidden = Boolean(data.cancel_at_period_end);
        document.getElementById("resume-sub-btn").hidden = !data.cancel_at_period_end;
      }

      async function loadConfig() {
        const res = await fetch(`${BILLING}/toss/config`);
        const data = await res.json();
        tossEnabled = Boolean(data.enabled);
        const note = document.getElementById("pay-note");
        note.textContent = tossEnabled
          ? "자동결제(빌링)는 토스 가맹점 계약 후 「카드로 구독하기」가 동작합니다. 심사·결제창 캡처는 「카드 결제창(심사용)」을 사용하세요."
          : "토스 테스트 키가 서버에 설정되면 구독 버튼이 활성화됩니다.";
      }

      async function loadPlans() {
        const res = await fetch(`${BILLING}/plans`);
        const data = await res.json();
        const grid = document.getElementById("plan-grid");
        grid.replaceChildren();
        const hidePlans =
          subInfo &&
          subInfo.active &&
          subInfo.status === "active" &&
          !subInfo.cancel_at_period_end;
        if (hidePlans) {
          return;
        }
        for (const plan of data.plans.filter((p) => (p.product === "macro" || p.product === "bundle") && p.interval === "month")) {
          const card = document.createElement("div");
          card.className = "plan-card";
          const title = plan.product === "bundle" ? "Macro + FieldNote" : "Macro";
          card.innerHTML = `<h3>${title} 월간</h3><p>${plan.price.toLocaleString()}원 / 매월 자동결제</p>`;
          const actions = document.createElement("div");
          actions.className = "pay-actions";
          const cardBtn = document.createElement("button");
          cardBtn.type = "button";
          cardBtn.className = "btn-pay btn-pay--card";
          cardBtn.textContent = tossEnabled ? "카드로 구독하기" : "카드 구독 준비 중";
          cardBtn.disabled = !tossEnabled || !me;
          cardBtn.addEventListener("click", () => startBilling(plan));
          const onceBtn = document.createElement("button");
          onceBtn.type = "button";
          onceBtn.className = "btn-pay btn-pay--outline";
          onceBtn.textContent = tossEnabled ? "카드 결제창 (심사용)" : "결제창 준비 중";
          onceBtn.disabled = !tossEnabled || !me;
          onceBtn.addEventListener("click", () => startOneTimePayment(plan));
          actions.append(cardBtn, onceBtn);
          card.appendChild(actions);
          grid.appendChild(card);
        }
      }

      async function startBilling(plan) {
        if (!me) {
          alert("로그인 후 진행해 주세요.");
          return;
        }
        const res = await fetch(`${BILLING}/toss/billing/prepare`, {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ plan_id: plan.id }),
        });
        if (!res.ok) {
          const text = await res.text();
          alert(text || "구독 준비를 시작하지 못했습니다.");
          return;
        }
        const prepared = await res.json();
        const tossPayments = TossPayments(prepared.clientKey);
        const payment = tossPayments.payment({ customerKey: prepared.customerKey });
        const successUrl = `${window.location.origin}/subscribe/billing-success.html?pending=${encodeURIComponent(prepared.pendingId)}`;
        try {
          await payment.requestBillingAuth({
            method: "CARD",
            successUrl,
            failUrl: `${window.location.origin}/subscribe/fail.html`,
          });
        } catch (err) {
          if (err && err.code === "USER_CANCEL") {
            return;
          }
          const msg = (err && err.message) || "";
          if (msg.includes("빌링") || msg.includes("BILLING")) {
            alert(
              "자동결제(빌링) 계약이 아직 활성화되지 않았습니다. 토스 가맹계약팀에 빌링 계약을 요청하거나, 아래 「카드 결제창(심사용)」으로 결제창을 확인하세요."
            );
            return;
          }
          alert(msg || "카드 등록창을 열지 못했습니다.");
        }
      }

      async function startOneTimePayment(plan) {
        if (!me) {
          alert("로그인 후 진행해 주세요.");
          return;
        }
        const res = await fetch(`${BILLING}/toss/prepare`, {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ plan_id: plan.id }),
        });
        if (!res.ok) {
          alert("결제 준비를 시작하지 못했습니다.");
          return;
        }
        const prepared = await res.json();
        const tossPayments = TossPayments(prepared.clientKey);
        const payment = tossPayments.payment({ customerKey: prepared.customerKey });
        try {
          await payment.requestPayment({
            method: "CARD",
            amount: { currency: "KRW", value: prepared.amount },
            orderId: prepared.orderId,
            orderName: prepared.orderName,
            successUrl: `${window.location.origin}/subscribe/success.html`,
            failUrl: `${window.location.origin}/subscribe/fail.html`,
          });
        } catch (err) {
          if (err && err.code === "USER_CANCEL") {
            return;
          }
          alert((err && err.message) || "결제창을 열지 못했습니다.");
        }
      }

      async function setCancel(cancelAtPeriodEnd) {
        const res = await fetch(`${BILLING}/subscription/cancel`, {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ cancel_at_period_end: cancelAtPeriodEnd }),
        });
        if (!res.ok) {
          alert("구독 상태를 변경하지 못했습니다.");
          return;
        }
        await loadSubscription();
        await loadPlans();
      }

      document.getElementById("login-btn").addEventListener("click", () => {
        const next = encodeURIComponent("/subscribe/");
        location.href = `${AUTH}/google/login?next=${next}`;
      });
      document.getElementById("kakao-login-btn").addEventListener("click", () => {
        const next = encodeURIComponent("/subscribe/");
        location.href = `${AUTH}/kakao/login?next=${next}`;
      });
      document.getElementById("logout-btn").addEventListener("click", async () => {
        await fetch(`${AUTH}/logout`, { method: "POST", credentials: "include" });
        await refreshAuth();
      });
      document.getElementById("review-login-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const email = document.getElementById("review-email").value.trim();
        const password = document.getElementById("review-password").value;
        const res = await fetch(`${AUTH}/review-login`, {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        if (!res.ok) {
          alert("이메일 또는 비밀번호가 올바르지 않습니다.");
          return;
        }
        await refreshAuth();
      });

      document.getElementById("cancel-sub-btn").addEventListener("click", () => {
        if (confirm("다음 결제일부터 자동 결제를 멈춥니다. 이번 이용 기간까지는 계속 사용할 수 있습니다.")) {
          setCancel(true);
        }
      });
      document.getElementById("resume-sub-btn").addEventListener("click", () => setCancel(false));

      async function boot() {
        await refreshAuth();
        await loadConfig();
        await loadSubscription();
        await loadPlans();
      }
      boot();
    </script>
  </body>
</html>
