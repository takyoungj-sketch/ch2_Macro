<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>구독 등록 | CH2 DATA</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero hero--document">
        <h1 class="hero__title">구독 등록</h1>
        <p class="hero__lead" id="msg">카드 등록과 첫 결제를 확인하는 중입니다…</p>
      </header>
      <p class="policy-meta" style="text-align: center">
        <a href="/subscribe/">구독 페이지로 돌아가기</a>
      </p>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const authKey = params.get("authKey");
      const customerKey = params.get("customerKey");
      const pendingId = params.get("pending");
      const msg = document.getElementById("msg");

      async function run() {
        if (!authKey || !customerKey || !pendingId) {
          msg.textContent = "등록 정보가 없습니다. 구독 페이지에서 다시 시도해 주세요.";
          return;
        }
        const res = await fetch("/api/billing/toss/billing/activate", {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            auth_key: authKey,
            customer_key: customerKey,
            pending_id: pendingId,
          }),
        });
        if (!res.ok) {
          msg.textContent = "구독 등록에 실패했습니다. 통합 게시판으로 문의해 주세요.";
          return;
        }
        msg.textContent = "월 구독이 시작되었습니다. 매월 자동 결제되며, 해지 시 이번 기간 말까지 이용할 수 있습니다.";
      }
      run();
    </script>
  </body>
</html>
