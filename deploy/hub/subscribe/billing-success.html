<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>구독 등록 | CH2 DATA</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero hero--document">
        <h1 class="hero__title">구독 등록</h1>
        <p class="hero__lead" id="msg">카드 등록을 확인하는 중입니다.</p>
      </header>
      <p class="policy-meta" style="text-align: center">
        <a href="/subscribe/">구독 페이지로 돌아가기</a>
      </p>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const authKey = params.get("authKey");
      const customerKey = params.get("customerKey");
      const pendingId = params.get("pending");
      const msg = document.getElementById("msg");

      async function run() {
        if (!authKey || !customerKey || !pendingId) {
          msg.textContent = "등록 정보가 없습니다. 구독 페이지에서 다시 시도해 주세요.";
          return;
        }
        const res = await fetch("/api/billing/toss/billing/activate", {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            auth_key: authKey,
            customer_key: customerKey,
            pending_id: pendingId,
          }),
        });
        if (!res.ok) {
          msg.textContent = "카드 등록에 실패했습니다. 구독 페이지에서 다시 시도해 주세요.";
          return;
        }
        const data = await res.json();
        const outcome = data.outcome;
        if (outcome === "scheduled") msg.textContent = "카드만 등록되었습니다. 체험이 끝나는 날에 첫 결제가 진행됩니다.";
        else if (outcome === "approved") msg.textContent = "결제가 승인되어 이용권이 반영되었습니다.";
        else if (outcome === "declined") msg.textContent = "결제가 승인되지 않았습니다. 카드를 다시 등록해 주세요.";
        else if (outcome === "expired") msg.textContent = "해지 예약이 반영되어 청구하지 않았습니다.";
        else msg.textContent = "결제 결과를 아직 확인하지 못했습니다. 구독 페이지에서 상태를 확인해 주세요.";
      }
      run();
    </script>
  </body>
</html>
