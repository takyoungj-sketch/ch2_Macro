<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CH2 DATA — 토지 실거래 통계·뷰어·필드노트" />
    <title>CH2 DATA</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <div class="site-auth" id="site-auth">
        <div class="login-actions" id="login-actions">
          <button type="button" class="btn-auth btn-auth--google" id="google-login">Google로 계속하기</button>
          <button type="button" class="btn-auth" id="kakao-login" hidden>Kakao로 계속하기</button>
        </div>
        <div class="user-actions" id="user-actions" hidden>
          <span class="user-actions__name" id="auth-name"></span>
          <button type="button" class="btn-auth btn-auth--ghost" id="logout-btn">로그아웃</button>
        </div>
      </div>
      <header class="hero">
        <h1 class="hero__title">CH2 DATA</h1>
        <p class="hero__lead" lang="en">Calculators with Human Hearts</p>
      </header>

      <main class="grid" aria-label="CH2 서비스">
        <button type="button" class="card card--soon" data-soon-product="Macro">
          <span class="card__badge card__badge--soon">준비 중</span>
          <h2 class="card__name">CH2 Macro</h2>
          <p class="card__desc">부동산 실거래 통계</p>
          <span class="card__action">준비중</span>
          <span class="card__soon-msg" hidden>준비 중입니다.</span>
        </button>

        <a class="card card--live" href="https://viewer.ch2data.com/">
          <span class="card__badge card__badge--live">이용 가능</span>
          <h2 class="card__name">CH2 Viewer</h2>
          <p class="card__desc">엑셀 연동 뷰어</p>
          <span class="card__action">바로가기 →</span>
        </a>

        <button type="button" class="card card--soon" data-soon-product="FieldNote">
          <span class="card__badge card__badge--soon">준비 중</span>
          <h2 class="card__name">CH2 FieldNote</h2>
          <p class="card__desc">현장조사 지원 앱</p>
          <span class="card__action">준비중</span>
          <span class="card__soon-msg" hidden>준비 중입니다.</span>
        </button>
      </main>

      <section class="board-banner" aria-label="고객의 소리">
        <a class="board-banner__link" href="/board/">
          <span class="board-banner__title">고객의 소리</span>
          <span class="board-banner__desc">질문 · 오류 신고 · 기능 개선 제안</span>
        </a>
      </section>

      <footer class="footer">
        <nav class="footer__links" aria-label="법률 및 정책 링크">
          <a href="/privacy/">개인정보처리방침</a>
          <a href="/terms/">이용약관</a>
          <a href="/refund/">환불 정책</a>
          <a href="/subscription/">구독 정책</a>
        </nav>
        <p>© CH2 DATA</p>
      </footer>
    </div>
    <script src="/hub-auth.js" defer></script>
  </body>
</html>
