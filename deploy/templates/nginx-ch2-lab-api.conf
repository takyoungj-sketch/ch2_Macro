# server { } 안에, location /api/ 보다 앞에 include.
# 화면만 잠그면 랩 JSON이 열린다.

location ^~ /api/regional-profile/lab/ {
    include /etc/nginx/snippets/ch2-lab-auth.conf;
    include /etc/nginx/snippets/ch2-api-proxy-token.conf;
    proxy_pass http://127.0.0.1:8000/api/regional-profile/lab/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

location ^~ /api/admin/ {
    include /etc/nginx/snippets/ch2-lab-auth.conf;
