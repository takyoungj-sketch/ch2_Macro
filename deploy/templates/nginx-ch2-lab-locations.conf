# server { } 안에 include. 게이트웨이 카드 없음.
location = /lab {
    return 301 /lab/;
}

location = /lab/index.html {
    include /etc/nginx/snippets/ch2-lab-auth.conf;
    alias /opt/ch2_Macro/frontend-lab/dist/index.html;
    add_header Cache-Control "no-cache, must-revalidate";
    add_header X-Robots-Tag "noindex, nofollow" always;
}

location /lab/ {
    include /etc/nginx/snippets/ch2-lab-auth.conf;
    alias /opt/ch2_Macro/frontend-lab/dist/;
    try_files $uri $uri/ /lab/index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
