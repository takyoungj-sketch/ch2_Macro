# CH2 DATA — portal hub (ch2data.com root)
# /etc/nginx/sites-available/ch2data-hub
#
# 1) sudo mkdir -p /var/www/ch2data-hub
# 2) deploy/hub/* → /var/www/ch2data-hub (deploy/scripts/deploy-hub.sh)
# 3) board: deploy/scripts/redeploy-board.sh (FastAPI /api/board + static /board)
# 4) sudo ln -sf /etc/nginx/sites-available/ch2data-hub /etc/nginx/sites-enabled/
# 5) sudo nginx -t && sudo systemctl reload nginx
# 6) sudo certbot --nginx -d ch2data.com -d www.ch2data.com

server {
    listen 80;
    listen [::]:80;
    server_name ch2data.com www.ch2data.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ch2data.com www.ch2data.com;

    root /var/www/ch2data-hub;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/ch2data.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ch2data.com/privkey.pem;

    location /api/auth/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/billing/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/platform/ {
        client_max_body_size 50m;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/board/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /board {
        alias /opt/ch2_Macro/deploy/board/public;
        try_files $uri $uri/ /board/index.html;
    }

    location = /board/ {
        alias /opt/ch2_Macro/deploy/board/public/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
        return 204;
    }
}
