# Regional Profile feature catalog (SSOT)
# - features: UI/표시용 (frontend-profile · 레거시 동기화)
# - twin_vector: Twin / 지역비교 Similarity Engine이 읽는 Feature 집합 (D-029)
# Frontend UI: frontend/src/constants/profileFeatureCatalog.ts 와 features 동기화
version: "1.0"

# ── D-029 Twin Vector (Phase A 게이트) ─────────────────────────────────────
# Engine: Catalog → Vector → Weight(profile_weight.yaml) → Similarity
# Profile에 새 지표를 넣으면 여기 key + (필요 시) 빌더 적재만 추가.
twin_vector:
  version: "2.1"
  features:
    population:
      profile_path: population
      block: population
      dtype: numeric
      mask: optional
      label_ko: 인구
    market_mix:
      profile_path: yearly_mix.count_share_by_type
      block: market_mix
      dtype: ratio_vector
      mask_from: market_presence
      label_ko: 8대 시장 구성비
    land_top1:
      profile_path: land_top1
      block: land_profile
      dtype: land_top
      label_ko: 토지 Top1 (용도×지목군)
    land_top2:
      profile_path: land_top2
      block: land_profile
      dtype: land_top
      label_ko: 토지 Top2
    land_top3:
      profile_path: land_top3
      block: land_profile
      dtype: land_top
      label_ko: 토지 Top3
    apt_p25:
      profile_path: apartment_p25
      block: apartment_profile
      dtype: numeric
      unit: manwon_per_sqm
      window: last_3y
      mask_from: market_presence.아파트
      mask_min_count_from: apartment_count
      mask_min_count: 15
      label_ko: 아파트 ㎡당 P25
    apt_p50:
      profile_path: apartment_median
      block: apartment_profile
      dtype: numeric
      unit: manwon_per_sqm
      window: last_3y
      mask_from: market_presence.아파트
      mask_min_count_from: apartment_count
      mask_min_count: 15
      label_ko: 아파트 ㎡당 P50
    apt_p75:
      profile_path: apartment_p75
      block: apartment_profile
      dtype: numeric
      unit: manwon_per_sqm
      window: last_3y
      mask_from: market_presence.아파트
      mask_min_count_from: apartment_count
      mask_min_count: 15
      label_ko: 아파트 ㎡당 P75
    commercial_p50:
      profile_path: commercial_median
      block: commercial_profile
      dtype: numeric
      unit: manwon_per_sqm
      window: last_3y
      mask_from: market_presence.상가
      mask_min_count_from: commercial_count
      mask_min_count: 10
      label_ko: 상가 ㎡당 P50
    factory_p50:
      profile_path: factory_median
      block: factory_profile
      dtype: numeric
      unit: manwon_per_sqm
      window: last_3y
      mask_from: market_presence.공장
      mask_min_count_from: factory_count
      mask_min_count: 8
      label_ko: 공장 ㎡당 P50
    detached_p50:
      profile_path: detached_median
      block: detached_profile
      dtype: numeric
      unit: manwon_per_sqm
      window: last_3y
      mask_from: market_presence.단독다가구
      mask_min_count_from: detached_count
      mask_min_count: 10
      label_ko: 단독 ㎡당 P50
    market_presence:
      profile_path: market_presence
      block: market_mix
      dtype: mask
      label_ko: 시장 존재 마스크
    represent_market:
      profile_path: dominant_type
      block: market_mix
      dtype: categorical
      label_ko: 대표시장

