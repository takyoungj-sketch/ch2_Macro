name: Deploy CH2 board to VPS

on:
  push:
    branches: [main]
    paths:
      - "deploy/board/**"
      - "deploy/hub/**"
      - "deploy/scripts/redeploy-board.sh"
      - "deploy/scripts/deploy-hub.sh"
      - "deploy/templates/nginx-ch2data-hub.conf"
      - "deploy/templates/ch2-board.service"
      - ".github/workflows/deploy-ch2-board.yml"
  workflow_dispatch:

concurrency:
  group: ch2-board-vps-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/ch2_Macro
            git fetch origin
            git checkout main
            git reset --hard origin/main
            bash /opt/ch2_Macro/deploy/scripts/redeploy-board.sh main
            sudo bash /opt/ch2_Macro/deploy/scripts/deploy-hub.sh
